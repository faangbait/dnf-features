name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-scenarios:
    # Ubuntu 24.04's host AppArmor policy can block nested unprivileged user
    # namespaces. Keep the rootless Feature's runtime policy narrow instead of
    # disabling AppArmor for every consumer merely to accommodate this runner.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        features:
          - aws-cli
          - docker-in-docker
          - docker-outside-of-docker
          - secure-containers
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        run: devcontainer features test -f ${{ matrix.features }} --skip-autogenerated --skip-duplicated .

  test-global:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only .
