name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  DEVCONTAINER_CLI_VERSION: "0.88.0"

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Check Feature release versions"
        run: .github/scripts/prepare-feature-release.sh

  test-scenarios:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - aws-cli
          - docker-in-docker
          - docker-outside-of-docker
          - terraform
          # RootlessKit mount propagation is denied by the AppArmor profile on
          # GitHub-hosted runners. Do not weaken the Feature to accommodate CI;
          # run secure-containers end-to-end on a suitable self-hosted runner.
    steps:
      - uses: actions/checkout@v4

      - name: "Install devcontainer CLI"
        run: npm install -g "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        run: devcontainer features test -f ${{ matrix.features }} --skip-autogenerated --skip-duplicated .

  secure-containers-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - base-image: registry.access.redhat.com/ubi10/ubi:latest
            package-manager: dnf
          - base-image: registry.access.redhat.com/ubi10/ubi-minimal:latest
            package-manager: microdnf
    steps:
      - uses: actions/checkout@v4

      - name: "Install secure-containers with ${{ matrix.package-manager }}"
        env:
          BASE_IMAGE: ${{ matrix.base-image }}
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
        run: >-
          docker build
          --build-arg "BASE_IMAGE=${BASE_IMAGE}"
          --build-arg "EXPECTED_PACKAGE_MANAGER=${PACKAGE_MANAGER}"
          --file test/secure-containers/install-only.Dockerfile
          .
